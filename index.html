<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个简洁的本地留言板" />
  <title>留声板 · 留下此刻的话</title>
  <style>
    :root { --ink:#172038; --muted:#6d7689; --line:#e7e8ee; --paper:#fffdfa; --accent:#5a56e8; --accent-dark:#4140bd; --rose:#fff0ef; --rose-ink:#b23c4a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:radial-gradient(circle at 8% 4%,#eae7ff 0,transparent 28rem),radial-gradient(circle at 94% 13%,#dff6ee 0,transparent 24rem),#f7f7fb; }
    button,input,textarea { font:inherit; }
    .shell { width:min(940px,calc(100% - 32px)); margin:0 auto; padding:58px 0 72px; }
    .hero { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:34px; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font-weight:800; font-size:13px; letter-spacing:.12em; }
    h1 { font-family:Georgia,"Times New Roman","Microsoft YaHei",serif; font-size:clamp(38px,7vw,68px); line-height:.98; letter-spacing:-.055em; margin:0; }
    .subtitle { max-width:265px; color:var(--muted); margin:0; line-height:1.7; font-size:14px; }
    .panel { background:rgba(255,253,250,.9); border:1px solid rgba(255,255,255,.75); border-radius:24px; box-shadow:0 18px 60px rgba(37,42,88,.1); backdrop-filter:blur(12px); }
    form { padding:25px; display:grid; grid-template-columns:180px 1fr; gap:16px; }
    label { display:block; color:#475068; font-weight:700; font-size:13px; }
    input,textarea { display:block; margin-top:8px; width:100%; border:1px solid var(--line); border-radius:12px; outline:none; padding:12px 14px; color:var(--ink); background:#fff; transition:border .2s,box-shadow .2s; }
    textarea { resize:vertical; min-height:112px; line-height:1.65; }
    input:focus,textarea:focus { border-color:#908df4; box-shadow:0 0 0 4px #edecff; }
    .message-field { grid-column:1 / -1; }
    .form-foot { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .hint { color:var(--muted); font-size:12px; }
    .primary,.text-button,.delete { border:0; cursor:pointer; font-weight:800; transition:transform .15s,background .15s,color .15s; }
    .primary { padding:12px 20px; border-radius:12px; color:white; background:var(--accent); box-shadow:0 8px 18px rgba(90,86,232,.22); }
    .primary:hover { background:var(--accent-dark); transform:translateY(-1px); }
    .board-header { margin:46px 4px 18px; display:flex; justify-content:space-between; align-items:center; gap:18px; }
    h2 { font-size:19px; margin:0; letter-spacing:-.03em; }
    .count { color:var(--muted); font-size:13px; margin-left:8px; font-weight:500; }
    .text-button { background:transparent; color:var(--rose-ink); padding:7px 9px; border-radius:8px; font-size:13px; }
    .text-button:hover { background:var(--rose); }
    #messages { display:grid; gap:14px; }
    .message { padding:21px 22px; background:var(--paper); border:1px solid #ececf1; border-radius:18px; box-shadow:0 5px 18px rgba(38,45,80,.04); animation:appear .3s ease both; }
    .message-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .author { font-weight:800; font-size:15px; }
    time { color:#8b93a5; font-size:12px; }
    .delete { color:#9298a7; background:#f4f5f8; border-radius:8px; padding:6px 10px; font-size:12px; }
    .delete:hover { color:var(--rose-ink); background:var(--rose); }
    .message p { white-space:pre-wrap; overflow-wrap:anywhere; margin:14px 0 0; line-height:1.72; font-size:15px; }
    .empty { padding:50px 18px; text-align:center; color:var(--muted); border:1px dashed #d9dce7; border-radius:18px; }
    .empty strong { display:block; color:#4e566b; margin-bottom:7px; }
    @keyframes appear { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @media (max-width:600px) { .shell { width:min(100% - 24px,940px); padding-top:38px; } .hero { display:block; } .subtitle { margin-top:19px; } form { grid-template-columns:1fr; padding:18px; gap:13px; } .message-field,.form-foot { grid-column:auto; } .form-foot { align-items:flex-end; } .hint { max-width:180px; line-height:1.5; } .board-header { margin-top:32px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div><p class="eyebrow">A SMALL PLACE TO SPEAK</p><h1 id="page-title">留声板</h1></div>
      <p class="subtitle">把此刻想说的话留在这里。它会安静地保存在这台设备的浏览器中。</p>
    </section>
    <section class="panel" aria-label="发布留言">
      <form id="messageForm">
        <label>你的昵称<input id="nickname" maxlength="24" required placeholder="例如：小林" autocomplete="name" /></label>
        <label class="message-field">想说的话<textarea id="content" maxlength="500" required placeholder="写下你的留言…"></textarea></label>
        <div class="form-foot"><span class="hint"><span id="length">0</span> / 500 字 · <span id="status">所有访客可见</span></span><button class="primary" type="submit">发布留言</button></div>
      </form>
    </section>
    <section aria-labelledby="board-title">
      <div class="board-header"><div><h2 id="board-title">大家的留言 <span class="count" id="count"></span></h2></div></div>
      <div id="messages" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const API_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/rest/v1/messages';
    const API_KEY = 'sb_publishable_rAeVBzahh96lu4guvPb0mQ_At69HCfK';
    const form = document.querySelector('#messageForm');
    const nickname = document.querySelector('#nickname');
    const content = document.querySelector('#content');
    const messages = document.querySelector('#messages');
    const count = document.querySelector('#count');
    const length = document.querySelector('#length');
    const status = document.querySelector('#status');
    const headers = { apikey: API_KEY, Authorization: `Bearer ${API_KEY}`, 'Content-Type': 'application/json' };
    const formatDate = value => new Intl.DateTimeFormat('zh-CN', { dateStyle:'medium', timeStyle:'short' }).format(new Date(value));
    function render(items) {
      count.textContent = items.length ? `(${items.length})` : '';
      messages.replaceChildren();
      if (!items.length) {
        const empty = document.createElement('div'); empty.className = 'empty';
        empty.innerHTML = '<strong>还没有留言</strong><span>做第一个写下心情的人吧。</span>';
        messages.append(empty); return;
      }
      items.forEach(item => {
        const card = document.createElement('article'); card.className = 'message';
        const top = document.createElement('div'); top.className = 'message-top';
        const author = document.createElement('span'); author.className = 'author'; author.textContent = item.nickname;
        const meta = document.createElement('div');
        const time = document.createElement('time'); time.dateTime = item.created_at; time.textContent = formatDate(item.created_at);
        meta.append(time); top.append(author, meta);
        const text = document.createElement('p'); text.textContent = item.content;
        card.append(top, text); messages.append(card);
      });
    }
    content.addEventListener('input', () => length.textContent = content.value.length);
    async function loadMessages() {
      status.textContent = '正在加载…';
      try {
        const response = await fetch(`${API_URL}?select=id,nickname,content,created_at&order=created_at.desc`, { headers });
        if (!response.ok) throw new Error();
        render(await response.json()); status.textContent = '所有访客可见';
      } catch { status.textContent = '加载失败，请稍后重试'; }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault(); const name = nickname.value.trim(); const text = content.value.trim();
      if (!name || !text) return;
      status.textContent = '正在发布…';
      try {
        const response = await fetch(API_URL, { method: 'POST', headers: { ...headers, Prefer: 'return=minimal' }, body: JSON.stringify({ nickname: name, content: text }) });
        if (!response.ok) throw new Error();
        content.value = ''; length.textContent = '0'; await loadMessages(); content.focus();
      } catch { status.textContent = '发布失败，请稍后重试'; }
    });
    loadMessages();
  </script>
</body>
</html>
