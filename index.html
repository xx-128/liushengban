<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个简洁的在线留言板" />
  <title>留言板 · 留下此刻的话</title>
  <style>
    :root { --ink:#171b2c; --muted:#747b8e; --line:#e7e6ed; --paper:#fffdfa; --accent:#6258de; --accent-dark:#4c43c3; --soft:#f0efff; --danger:#ba4050; --danger-soft:#fff0f1; --success:#18795a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:radial-gradient(circle at 8% 3%,#ebe8ff 0,transparent 28rem),radial-gradient(circle at 96% 8%,#dcf5ed 0,transparent 25rem),#f7f7fb; }
    button,input,textarea { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .shell { width:min(940px,calc(100% - 32px)); margin:0 auto; padding:58px 0 72px; }
    .hero { margin-bottom:34px; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font-weight:800; font-size:13px; letter-spacing:.12em; }
    h1 { font-family:Georgia,"Times New Roman","Microsoft YaHei",serif; font-size:clamp(42px,7vw,70px); line-height:.98; letter-spacing:-.055em; margin:0; }
    .panel { background:rgba(255,253,250,.92); border:1px solid rgba(255,255,255,.78); border-radius:24px; box-shadow:0 18px 60px rgba(37,42,88,.1); backdrop-filter:blur(12px); }
    form { padding:25px; display:grid; grid-template-columns:180px 1fr; gap:16px; }
    label { display:block; color:#475068; font-weight:700; font-size:13px; }
    input,textarea { display:block; margin-top:8px; width:100%; border:1px solid var(--line); border-radius:12px; outline:none; padding:12px 14px; color:var(--ink); background:#fff; transition:border .2s,box-shadow .2s; }
    textarea { resize:vertical; min-height:112px; line-height:1.65; }
    input:focus,textarea:focus { border-color:#918cf1; box-shadow:0 0 0 4px #edecff; }
    .message-field { grid-column:1 / -1; }
    .form-foot { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .hint { color:var(--muted); font-size:12px; }
    .primary,.secondary,.ghost,.danger,.icon-button { border:0; cursor:pointer; font-weight:800; transition:transform .15s,background .15s,color .15s,opacity .15s; }
    .primary { padding:12px 20px; border-radius:12px; color:white; background:var(--accent); box-shadow:0 8px 18px rgba(90,86,232,.22); }
    .primary:hover { background:var(--accent-dark); transform:translateY(-1px); }
    .primary:disabled,.danger:disabled { opacity:.55; cursor:not-allowed; transform:none; }
    .secondary { padding:9px 13px; border-radius:10px; color:var(--accent-dark); background:var(--soft); }
    .secondary:hover { background:#e5e3ff; }
    .ghost { padding:9px 12px; border-radius:10px; color:#60677a; background:transparent; }
    .ghost:hover { background:#f1f2f6; }
    .danger { padding:10px 14px; border-radius:10px; color:#fff; background:var(--danger); }
    .board-header { margin:46px 4px 18px; display:flex; justify-content:space-between; align-items:center; gap:18px; }
    h2 { font-size:19px; margin:0; letter-spacing:-.03em; }
    .count { color:var(--muted); font-size:13px; margin-left:8px; font-weight:500; }
    .board-actions { display:flex; align-items:center; gap:8px; }
    .manage-state { display:none; align-items:center; gap:8px; color:var(--success); font-size:12px; font-weight:800; }
    body.managing .manage-state { display:flex; }
    body.managing #openManager { display:none; }
    #messages { display:grid; gap:14px; }
    .message { padding:21px 22px; background:var(--paper); border:1px solid #ececf1; border-radius:18px; box-shadow:0 5px 18px rgba(38,45,80,.04); animation:appear .3s ease both; }
    .message-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .author { display:block; font-weight:800; font-size:15px; }
    time { display:block; color:#8b93a5; font-size:12px; margin-top:5px; }
    .message-tools { display:none; gap:7px; }
    body.managing .message-tools { display:flex; }
    .icon-button { color:#687084; background:#f1f2f6; border-radius:8px; padding:7px 10px; font-size:12px; }
    .icon-button:hover { color:var(--accent-dark); background:var(--soft); }
    .icon-button.remove:hover { color:var(--danger); background:var(--danger-soft); }
    .message p { white-space:pre-wrap; overflow-wrap:anywhere; margin:14px 0 0; line-height:1.72; font-size:15px; }
    .comments { margin-top:18px; padding-top:15px; border-top:1px solid #ececf1; }
    .comment-list { display:grid; gap:9px; }
    .comment { padding:11px 13px; border-radius:12px; background:#f6f5fa; }
    .comment-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .comment-author { color:#4f566a; font-size:12px; font-weight:800; }
    .comment time { margin:0; font-size:11px; }
    .comment .comment-text { margin:6px 0 0; font-size:13px; line-height:1.6; }
    .comment-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; }
    .comment-count { color:var(--muted); font-size:12px; }
    .comment-toggle { border:0; border-radius:9px; padding:7px 11px; cursor:pointer; color:var(--accent-dark); background:var(--soft); font-size:12px; font-weight:800; }
    .comment-toggle:hover { background:#e5e3ff; }
    .comment-form { display:none; grid-template-columns:130px 1fr auto; align-items:end; gap:9px; padding:12px 0 0; }
    .comment-form.open { display:grid; }
    .comment-form input,.comment-form textarea { margin:0; min-height:42px; padding:10px 12px; font-size:13px; }
    .comment-form textarea { height:42px; min-height:42px; max-height:120px; }
    .comment-submit { min-height:42px; padding:0 14px; }
    .empty { padding:50px 18px; text-align:center; color:var(--muted); border:1px dashed #d9dce7; border-radius:18px; }
    .empty strong { display:block; color:#4e566b; margin-bottom:7px; }
    dialog { width:min(460px,calc(100% - 28px)); border:0; border-radius:20px; padding:0; color:var(--ink); box-shadow:0 28px 90px rgba(28,31,58,.28); }
    dialog::backdrop { background:rgba(24,26,42,.42); backdrop-filter:blur(4px); }
    .dialog-body { padding:25px; }
    .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .dialog-head h3 { margin:0; font-size:21px; }
    .dialog-head p { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .close { border:0; border-radius:9px; width:34px; height:34px; cursor:pointer; color:#697084; background:#f1f2f6; font-size:20px; line-height:1; }
    .dialog-form { display:block; padding:0; margin-top:20px; }
    .dialog-form label + label { margin-top:14px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .error { min-height:20px; margin:9px 0 -5px; color:var(--danger); font-size:12px; }
    .toast { position:fixed; left:50%; bottom:26px; z-index:10; max-width:calc(100% - 32px); transform:translate(-50%,18px); opacity:0; pointer-events:none; color:white; background:#25283b; border-radius:11px; padding:10px 15px; font-size:13px; box-shadow:0 12px 35px rgba(20,22,40,.25); transition:.22s ease; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @keyframes appear { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @media (max-width:600px) { .shell { width:min(100% - 24px,940px); padding-top:38px; } form { grid-template-columns:1fr; padding:18px; gap:13px; } .message-field,.form-foot { grid-column:auto; } .form-foot { align-items:flex-end; } .hint { max-width:180px; line-height:1.5; } .board-header { margin-top:32px; align-items:flex-start; } .message { padding:18px; } .message-top { gap:8px; } .comment-form { grid-template-columns:1fr; } .comment-form textarea { height:72px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">A SMALL PLACE TO SPEAK</p>
      <h1 id="page-title">留言板</h1>
    </section>
    <section class="panel" aria-label="发布留言">
      <form id="messageForm">
        <label>你的昵称<input id="nickname" maxlength="24" required autocomplete="name" /></label>
        <label class="message-field">想说的话<textarea id="content" maxlength="500" required placeholder="写下你的留言…"></textarea></label>
        <div class="form-foot"><span class="hint"><span id="length">0</span> / 500 字</span><button class="primary" id="submitButton" type="submit">发布留言</button></div>
      </form>
    </section>
    <section aria-labelledby="board-title">
      <div class="board-header">
        <h2 id="board-title">大家的留言 <span class="count" id="count"></span></h2>
        <div class="board-actions">
          <button class="secondary" id="openManager" type="button">管理留言</button>
          <div class="manage-state"><span>管理模式</span><button class="ghost" id="exitManager" type="button">退出</button></div>
        </div>
      </div>
      <div id="messages" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="passwordDialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3>进入管理模式</h3><p>输入管理密码后，即可编辑或删除留言记录。</p></div><button class="close" data-close="passwordDialog" aria-label="关闭">×</button></div>
      <form class="dialog-form" id="passwordForm">
        <label>管理密码<input id="managerPassword" type="password" required autocomplete="current-password" placeholder="请输入密码" /></label>
        <p class="error" id="passwordError" role="alert"></p>
        <div class="dialog-actions"><button class="ghost" data-close="passwordDialog" type="button">取消</button><button class="primary" id="verifyButton" type="submit">验证并进入</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="editDialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3>编辑留言</h3><p>修改昵称或留言内容，保存后会立即更新。</p></div><button class="close" data-close="editDialog" aria-label="关闭">×</button></div>
      <form class="dialog-form" id="editForm">
        <label>昵称<input id="editNickname" maxlength="24" required /></label>
        <label>留言内容<textarea id="editContent" maxlength="500" required></textarea></label>
        <p class="error" id="editError" role="alert"></p>
        <div class="dialog-actions"><button class="ghost" data-close="editDialog" type="button">取消</button><button class="primary" id="saveEdit" type="submit">保存修改</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="confirmDialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3 id="confirmTitle">删除留言</h3><p id="confirmText">此操作无法撤销。</p></div><button class="close" data-close="confirmDialog" aria-label="关闭">×</button></div>
      <div class="dialog-actions"><button class="ghost" data-close="confirmDialog" type="button">取消</button><button class="danger" id="confirmAction" type="button">确认删除</button></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script>
    const API_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/rest/v1/messages';
    const COMMENTS_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/rest/v1/comments';
    const FUNCTION_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/functions/v1/manage-messages';
    const API_KEY = 'sb_publishable_rAeVBzahh96lu4guvPb0mQ_At69HCfK';
    const headers = { apikey:API_KEY, 'Content-Type':'application/json' };
    const $ = selector => document.querySelector(selector);
    const form = $('#messageForm'), nickname = $('#nickname'), content = $('#content'), messages = $('#messages');
    const count = $('#count'), length = $('#length'), submitButton = $('#submitButton'), toast = $('#toast');
    let items = [], comments = [], managerPassword = '', editingId = null, pendingAction = null, toastTimer;
    const formatDate = value => new Intl.DateTimeFormat('zh-CN', { dateStyle:'medium', timeStyle:'short' }).format(new Date(value));

    function notify(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    function setBusy(button, busy, label) { button.disabled = busy; if (busy) { button.dataset.label = button.textContent; button.textContent = label; } else if (button.dataset.label) { button.textContent = button.dataset.label; delete button.dataset.label; } }
    function closeDialog(id) { const dialog = document.getElementById(id); if (dialog.open) dialog.close(); }
    function render() {
      count.textContent = items.length ? `(${items.length})` : '';
      messages.replaceChildren();
      if (!items.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.innerHTML = '<strong>还没有留言</strong><span>做第一个写下心情的人吧。</span>'; messages.append(empty); return; }
      items.forEach(item => {
        const itemComments = comments.filter(comment => comment.message_id === item.id);
        const card = document.createElement('article'); card.className = 'message'; card.dataset.id = item.id;
        const top = document.createElement('div'); top.className = 'message-top';
        const meta = document.createElement('div');
        const author = document.createElement('span'); author.className = 'author'; author.textContent = item.nickname;
        const time = document.createElement('time'); time.dateTime = item.created_at; time.textContent = formatDate(item.created_at);
        meta.append(author,time);
        const tools = document.createElement('div'); tools.className = 'message-tools';
        const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'icon-button'; edit.dataset.action = 'edit'; edit.textContent = '编辑';
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'icon-button remove'; remove.dataset.action = 'delete'; remove.textContent = '删除';
        tools.append(edit,remove); top.append(meta,tools);
        const text = document.createElement('p'); text.textContent = item.content;
        const commentSection = document.createElement('div'); commentSection.className = 'comments';
        const commentList = document.createElement('div'); commentList.className = 'comment-list';
        itemComments.forEach(comment => {
          const row = document.createElement('div'); row.className = 'comment';
          const commentMeta = document.createElement('div'); commentMeta.className = 'comment-meta';
          const commentAuthor = document.createElement('span'); commentAuthor.className = 'comment-author'; commentAuthor.textContent = comment.nickname;
          const commentTime = document.createElement('time'); commentTime.dateTime = comment.created_at; commentTime.textContent = formatDate(comment.created_at);
          const commentText = document.createElement('p'); commentText.className = 'comment-text'; commentText.textContent = comment.content;
          commentMeta.append(commentAuthor,commentTime); row.append(commentMeta,commentText); commentList.append(row);
        });
        const commentActions = document.createElement('div'); commentActions.className = 'comment-actions';
        const commentCount = document.createElement('span'); commentCount.className = 'comment-count'; commentCount.textContent = itemComments.length ? `${itemComments.length} 条评论` : '还没有评论';
        const commentToggle = document.createElement('button'); commentToggle.type = 'button'; commentToggle.className = 'comment-toggle'; commentToggle.dataset.action = 'toggle-comment'; commentToggle.textContent = '评论';
        commentActions.append(commentCount,commentToggle);
        const commentForm = document.createElement('form'); commentForm.className = 'comment-form'; commentForm.dataset.commentForm = '';
        const commentNickname = document.createElement('input'); commentNickname.name = 'nickname'; commentNickname.maxLength = 24; commentNickname.required = true; commentNickname.placeholder = '昵称'; commentNickname.setAttribute('aria-label','评论昵称');
        const commentContent = document.createElement('textarea'); commentContent.name = 'content'; commentContent.maxLength = 300; commentContent.required = true; commentContent.placeholder = '写下你的评论…'; commentContent.setAttribute('aria-label','评论内容');
        const commentSubmit = document.createElement('button'); commentSubmit.type = 'submit'; commentSubmit.className = 'primary comment-submit'; commentSubmit.textContent = '发布评论';
        commentForm.append(commentNickname,commentContent,commentSubmit);
        commentSection.append(commentList,commentActions,commentForm);
        card.append(top,text,commentSection); messages.append(card);
      });
    }
    async function loadMessages() {
      try {
        const [messageResponse,commentResponse] = await Promise.all([
          fetch(`${API_URL}?select=id,nickname,content,created_at&order=created_at.desc`, { headers }),
          fetch(`${COMMENTS_URL}?select=id,message_id,nickname,content,created_at&order=created_at.asc`, { headers })
        ]);
        if (!messageResponse.ok || !commentResponse.ok) throw new Error();
        items = await messageResponse.json(); comments = await commentResponse.json(); render();
      }
      catch { messages.innerHTML = '<div class="empty"><strong>留言暂时无法加载</strong><span>请稍后刷新页面重试。</span></div>'; }
    }
    async function manage(payload) {
      const response = await fetch(FUNCTION_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ ...payload, password:managerPassword || $('#managerPassword').value }) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) { const error = new Error(data.error || '操作失败，请稍后重试'); error.status = response.status; throw error; }
      return data;
    }
    content.addEventListener('input', () => length.textContent = content.value.length);
    form.addEventListener('submit', async event => {
      event.preventDefault(); const name = nickname.value.trim(), text = content.value.trim(); if (!name || !text) return;
      setBusy(submitButton,true,'发布中…');
      try { const response = await fetch(API_URL, { method:'POST', headers:{ ...headers, Prefer:'return=minimal' }, body:JSON.stringify({ nickname:name, content:text }) }); if (!response.ok) throw new Error(); content.value = ''; length.textContent = '0'; await loadMessages(); content.focus(); notify('留言已发布'); }
      catch { notify('发布失败，请稍后重试'); } finally { setBusy(submitButton,false); }
    });
    $('#openManager').addEventListener('click', () => { $('#passwordError').textContent = ''; $('#managerPassword').value = ''; $('#passwordDialog').showModal(); setTimeout(() => $('#managerPassword').focus(), 0); });
    $('#passwordForm').addEventListener('submit', async event => {
      event.preventDefault(); const button = $('#verifyButton'); $('#passwordError').textContent = ''; setBusy(button,true,'验证中…');
      try { await manage({ action:'verify' }); managerPassword = $('#managerPassword').value; document.body.classList.add('managing'); closeDialog('passwordDialog'); notify('已进入管理模式'); }
      catch (error) { $('#passwordError').textContent = error.status === 401 ? '密码不正确，请重新输入' : error.message; }
      finally { setBusy(button,false); }
    });
    $('#exitManager').addEventListener('click', () => { managerPassword = ''; document.body.classList.remove('managing'); notify('已退出管理模式'); });
    messages.addEventListener('click', event => {
      const button = event.target.closest('[data-action]'); if (!button) return;
      if (button.dataset.action === 'toggle-comment') { const commentForm = button.closest('.message').querySelector('[data-comment-form]'); commentForm.classList.toggle('open'); if (commentForm.classList.contains('open')) commentForm.querySelector('[name="nickname"]').focus(); return; }
      if (!managerPassword) return;
      const item = items.find(entry => entry.id === button.closest('.message').dataset.id); if (!item) return;
      if (button.dataset.action === 'edit') { editingId = item.id; $('#editNickname').value = item.nickname; $('#editContent').value = item.content; $('#editError').textContent = ''; $('#editDialog').showModal(); }
      if (button.dataset.action === 'delete') { pendingAction = { action:'delete', id:item.id }; $('#confirmTitle').textContent = '删除这条留言？'; $('#confirmText').textContent = `“${item.nickname}”的留言将被永久删除。`; $('#confirmAction').textContent = '确认删除'; $('#confirmDialog').showModal(); }
    });
    messages.addEventListener('submit', async event => {
      const commentForm = event.target.closest('[data-comment-form]'); if (!commentForm) return;
      event.preventDefault(); const messageId = commentForm.closest('.message').dataset.id;
      const name = commentForm.elements.nickname.value.trim(), text = commentForm.elements.content.value.trim(), button = commentForm.querySelector('button');
      if (!name || !text) return; setBusy(button,true,'发布中…');
      try {
        const response = await fetch(COMMENTS_URL, { method:'POST', headers:{ ...headers, Prefer:'return=minimal' }, body:JSON.stringify({ message_id:messageId, nickname:name, content:text }) });
        if (!response.ok) throw new Error(); await loadMessages(); notify('评论已发布');
      } catch { notify('评论发布失败，请稍后重试'); } finally { setBusy(button,false); }
    });
    $('#editForm').addEventListener('submit', async event => {
      event.preventDefault(); const button = $('#saveEdit'), name = $('#editNickname').value.trim(), text = $('#editContent').value.trim(); if (!name || !text) return;
      setBusy(button,true,'保存中…'); $('#editError').textContent = '';
      try { await manage({ action:'update', id:editingId, nickname:name, content:text }); closeDialog('editDialog'); await loadMessages(); notify('留言已更新'); }
      catch (error) { $('#editError').textContent = error.message; } finally { setBusy(button,false); }
    });
    $('#confirmAction').addEventListener('click', async () => {
      if (!pendingAction) return; const button = $('#confirmAction'); setBusy(button,true,'处理中…');
      try { await manage(pendingAction); closeDialog('confirmDialog'); pendingAction = null; await loadMessages(); notify('操作已完成'); }
      catch (error) { closeDialog('confirmDialog'); notify(error.message); } finally { setBusy(button,false); }
    });
    document.addEventListener('click', event => { const button = event.target.closest('[data-close]'); if (button) closeDialog(button.dataset.close); });
    document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); }));
    loadMessages();
  </script>
</body>
</html>
