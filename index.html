<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个简洁的在线留言板" />
  <title>留言板 · 留下此刻的话</title>
  <style>
    :root { --ink:#171b2c; --muted:#747b8e; --line:#e7e6ed; --paper:#fffdfa; --accent:#6258de; --accent-dark:#4c43c3; --soft:#f0efff; --danger:#ba4050; --danger-soft:#fff0f1; --success:#18795a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:radial-gradient(circle at 8% 3%,#ebe8ff 0,transparent 28rem),radial-gradient(circle at 96% 8%,#dcf5ed 0,transparent 25rem),#f7f7fb; }
    body::before,body::after { content:""; position:fixed; z-index:-1; border-radius:999px; filter:blur(8px); opacity:.52; pointer-events:none; will-change:transform; }
    body::before { width:320px; height:320px; left:-120px; top:36%; background:radial-gradient(circle,#c9c3ff 0,rgba(201,195,255,0) 68%); animation:float-one 14s ease-in-out infinite alternate; }
    body::after { width:360px; height:360px; right:-150px; bottom:-70px; background:radial-gradient(circle,#bcebdc 0,rgba(188,235,220,0) 68%); animation:float-two 17s ease-in-out infinite alternate; }
    button,input,textarea { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .shell { width:min(940px,calc(100% - 32px)); margin:0 auto; padding:58px 0 72px; }
    .hero { margin-bottom:34px; animation:hero-in .75s cubic-bezier(.22,1,.36,1) both; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font-weight:800; font-size:13px; letter-spacing:.12em; animation:eyebrow-in .8s .08s cubic-bezier(.22,1,.36,1) both; }
    h1 { font-family:Georgia,"Times New Roman","Microsoft YaHei",serif; font-size:clamp(42px,7vw,70px); line-height:.98; letter-spacing:-.055em; margin:0; animation:title-in .85s .12s cubic-bezier(.16,1,.3,1) both; }
    .panel { --spot-x:50%; --spot-y:45%; position:relative; isolation:isolate; overflow:hidden; background:rgba(255,253,250,.92); border:1px solid rgba(255,255,255,.78); border-radius:24px; box-shadow:0 18px 60px rgba(37,42,88,.1); backdrop-filter:blur(12px); animation:panel-in .75s .18s cubic-bezier(.22,1,.36,1) both; transition:box-shadow .4s ease,transform .4s cubic-bezier(.22,1,.36,1); }
    .panel::before { content:""; position:absolute; z-index:-1; inset:-45%; background:conic-gradient(from 120deg,transparent 0 34%,rgba(111,96,235,.08) 42%,rgba(125,218,197,.09) 49%,transparent 58% 100%); animation:composer-aurora 11s linear infinite; pointer-events:none; }
    .panel::after { content:""; position:absolute; z-index:-1; inset:0; opacity:.14; background:radial-gradient(310px circle at var(--spot-x) var(--spot-y),rgba(107,92,235,.2),transparent 70%); transition:opacity .35s ease; pointer-events:none; }
    .panel:hover::after,.panel:focus-within::after { opacity:1; }
    .panel:focus-within { transform:translateY(-3px); box-shadow:0 26px 76px rgba(37,42,88,.15),0 0 0 1px rgba(98,88,222,.08); }
    .panel.published { animation:composer-success .72s cubic-bezier(.22,1,.36,1); }
    form { position:relative; z-index:1; padding:25px; display:grid; grid-template-columns:180px 1fr; gap:16px; }
    label { display:block; color:#475068; font-weight:700; font-size:13px; }
    #messageForm label { transition:color .25s,transform .3s cubic-bezier(.22,1,.36,1); }
    #messageForm label:focus-within { color:var(--accent-dark); transform:translateX(3px); }
    input,textarea { display:block; margin-top:8px; width:100%; border:1px solid var(--line); border-radius:12px; outline:none; padding:12px 14px; color:var(--ink); background:#fff; transition:border .25s,box-shadow .25s,transform .25s; }
    textarea { resize:vertical; min-height:112px; line-height:1.65; }
    input:focus,textarea:focus { border-color:#918cf1; box-shadow:0 0 0 4px #edecff; transform:translateY(-1px); }
    #messageForm textarea { transition:min-height .4s cubic-bezier(.22,1,.36,1),border .25s,box-shadow .25s,transform .25s; }
    #messageForm textarea:focus { min-height:132px; }
    .message-field { grid-column:1 / -1; }
    .form-foot { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .composer-progress { width:min(260px,45vw); }
    .hint { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .writing-note { opacity:.65; transform:translateX(-3px); transition:opacity .25s,transform .25s,color .25s; }
    .panel.is-writing .writing-note { opacity:1; transform:none; color:var(--accent-dark); }
    .character-track { position:relative; height:3px; overflow:hidden; margin-top:8px; border-radius:99px; background:#e9e8f0; }
    .character-progress { display:block; width:100%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#7c71eb,#5aebc6); box-shadow:0 0 12px rgba(98,88,222,.35); transform:scaleX(var(--progress-scale,0)); transform-origin:left center; transition:transform .32s cubic-bezier(.22,1,.36,1),background .25s; }
    .panel.near-limit .character-progress { background:linear-gradient(90deg,#e58a57,#d9485f); }
    .primary,.secondary,.ghost,.danger,.icon-button { border:0; cursor:pointer; font-weight:800; transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s,color .2s,opacity .2s,box-shadow .2s; }
    .primary { padding:12px 20px; border-radius:12px; color:white; background:var(--accent); box-shadow:0 8px 18px rgba(90,86,232,.22); }
    #submitButton { position:relative; overflow:hidden; min-width:108px; isolation:isolate; animation:button-breathe 3.4s ease-in-out infinite; }
    #submitButton::before { content:""; position:absolute; z-index:-1; top:-30%; bottom:-30%; left:-55%; width:38%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent); transform:skewX(-18deg); animation:button-shine 4.2s 1.2s ease-in-out infinite; }
    #submitButton:hover { box-shadow:0 13px 28px rgba(90,86,232,.34); }
    .primary:hover { background:var(--accent-dark); transform:translateY(-1px); }
    button:active:not(:disabled) { transform:translateY(1px) scale(.98); }
    .primary:disabled,.danger:disabled { opacity:.55; cursor:not-allowed; transform:none; }
    .secondary { padding:9px 13px; border-radius:10px; color:var(--accent-dark); background:var(--soft); }
    .secondary:hover { background:#e5e3ff; }
    .ghost { padding:9px 12px; border-radius:10px; color:#60677a; background:transparent; }
    .ghost:hover { background:#f1f2f6; }
    .danger { padding:10px 14px; border-radius:10px; color:#fff; background:var(--danger); }
    .board-header { margin:46px 4px 18px; display:flex; justify-content:space-between; align-items:center; gap:18px; animation:fade-up .65s .28s both; }
    h2 { font-size:19px; margin:0; letter-spacing:-.03em; }
    .count { color:var(--muted); font-size:13px; margin-left:8px; font-weight:500; }
    .board-actions { display:flex; align-items:center; gap:8px; }
    .manage-state { display:none; align-items:center; gap:8px; color:var(--success); font-size:12px; font-weight:800; }
    body.managing .manage-state { display:flex; }
    body.managing #openManager { display:none; }
    .filter-bar { position:relative; overflow:hidden; margin:0 0 18px; padding:16px 18px; border:1px solid rgba(101,88,222,.12); border-radius:18px; background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(245,244,255,.9)); box-shadow:0 10px 30px rgba(45,48,92,.06); backdrop-filter:blur(14px); animation:fade-up .7s .34s both; }
    .filter-bar::after { content:""; position:absolute; width:150px; height:150px; right:-55px; top:-90px; border-radius:50%; background:rgba(98,88,222,.1); transition:transform .5s cubic-bezier(.22,1,.36,1); }
    .filter-bar:hover::after { transform:scale(1.35); }
    .filter-main { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .filter-kicker { display:block; margin-bottom:4px; color:var(--accent); font-size:11px; font-weight:900; letter-spacing:.1em; }
    .filter-copy strong { font-size:14px; }
    .filter-controls { display:flex; align-items:center; gap:8px; }
    .date-picker { position:relative; display:flex; align-items:center; gap:8px; min-width:174px; height:42px; padding:0 11px; border:1px solid var(--line); border-radius:11px; background:#fff; color:#50586e; transition:border .2s,box-shadow .2s,transform .2s; }
    .date-picker:focus-within { border-color:#918cf1; box-shadow:0 0 0 4px #edecff; transform:translateY(-1px); }
    .date-picker svg { width:17px; height:17px; color:var(--accent); flex:0 0 auto; }
    .date-picker input { min-width:0; height:auto; margin:0; padding:0; border:0; border-radius:0; box-shadow:none; background:transparent; font-size:13px; cursor:pointer; }
    .date-picker input:focus { box-shadow:none; }
    .filter-button { height:42px; padding:0 13px; border:0; border-radius:11px; cursor:pointer; color:#5d6477; background:#f0f0f6; font-size:12px; font-weight:800; transition:.2s ease; }
    .filter-button:hover { color:var(--accent-dark); background:var(--soft); transform:translateY(-1px); }
    .filter-button:disabled { opacity:.45; cursor:default; transform:none; }
    .date-shortcuts { position:relative; z-index:1; display:flex; gap:7px; overflow-x:auto; margin-top:12px; padding-bottom:1px; scrollbar-width:none; }
    .date-shortcuts:empty { display:none; }
    .date-shortcuts::-webkit-scrollbar { display:none; }
    .date-chip { flex:0 0 auto; padding:7px 10px; border:1px solid transparent; border-radius:999px; cursor:pointer; color:#737a8d; background:rgba(255,255,255,.72); font-size:11px; font-weight:700; transition:.2s ease; }
    .date-chip:hover,.date-chip.active { border-color:#dcd9ff; color:var(--accent-dark); background:#eeecff; transform:translateY(-1px); }
    #messages { display:grid; gap:14px; }
    .message { padding:21px 22px; background:var(--paper); border:1px solid #ececf1; border-radius:18px; box-shadow:0 5px 18px rgba(38,45,80,.04); animation:appear .52s calc(var(--i,0) * 55ms) cubic-bezier(.22,1,.36,1) both; transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,border-color .3s; }
    .message:hover { transform:translateY(-3px); border-color:#e2e0f4; box-shadow:0 16px 38px rgba(38,45,80,.09); }
    .message-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .author { display:block; font-weight:800; font-size:15px; }
    time { display:block; color:#8b93a5; font-size:12px; margin-top:5px; }
    .message-tools { display:none; gap:7px; }
    body.managing .message-tools { display:flex; }
    .icon-button { color:#687084; background:#f1f2f6; border-radius:8px; padding:7px 10px; font-size:12px; }
    .icon-button:hover { color:var(--accent-dark); background:var(--soft); }
    .icon-button.remove:hover { color:var(--danger); background:var(--danger-soft); }
    .message p { white-space:pre-wrap; overflow-wrap:anywhere; margin:14px 0 0; line-height:1.72; font-size:15px; }
    .comments { margin-top:18px; padding-top:15px; border-top:1px solid #ececf1; }
    .comment-list { display:grid; gap:9px; }
    .comment { padding:11px 13px; border-radius:12px; background:#f6f5fa; animation:comment-in .35s cubic-bezier(.22,1,.36,1) both; transition:background .2s,transform .2s; }
    .comment:hover { background:#f0eff8; transform:translateX(2px); }
    .comment-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .comment-author { color:#4f566a; font-size:12px; font-weight:800; }
    .comment time { margin:0; font-size:11px; }
    .comment .comment-text { margin:6px 0 0; font-size:13px; line-height:1.6; }
    .comment-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; }
    .comment-count { color:var(--muted); font-size:12px; }
    .comment-toggle { border:0; border-radius:9px; padding:7px 11px; cursor:pointer; color:var(--accent-dark); background:var(--soft); font-size:12px; font-weight:800; }
    .comment-toggle:hover { background:#e5e3ff; }
    .comment-form { display:grid; grid-template-columns:130px 1fr auto; align-items:end; gap:9px; max-height:0; overflow:hidden; visibility:hidden; opacity:0; transform:translateY(-7px); padding:0; pointer-events:none; transition:max-height .38s cubic-bezier(.22,1,.36,1),opacity .25s,transform .35s,padding .35s,visibility 0s linear .38s; }
    .comment-form.open { max-height:150px; visibility:visible; opacity:1; transform:none; padding:12px 0 0; pointer-events:auto; transition-delay:0s; }
    .comment-form input,.comment-form textarea { margin:0; min-height:42px; padding:10px 12px; font-size:13px; }
    .comment-form textarea { height:42px; min-height:42px; max-height:120px; }
    .comment-submit { min-height:42px; padding:0 14px; }
    .empty { padding:50px 18px; text-align:center; color:var(--muted); border:1px dashed #d9dce7; border-radius:18px; }
    .empty strong { display:block; color:#4e566b; margin-bottom:7px; }
    dialog { width:min(460px,calc(100% - 28px)); border:0; border-radius:20px; padding:0; color:var(--ink); box-shadow:0 28px 90px rgba(28,31,58,.28); }
    dialog[open] { animation:dialog-in .35s cubic-bezier(.22,1,.36,1) both; }
    dialog[open]::backdrop { animation:backdrop-in .3s ease both; }
    dialog::backdrop { background:rgba(24,26,42,.42); backdrop-filter:blur(4px); }
    .dialog-body { padding:25px; }
    .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .dialog-head h3 { margin:0; font-size:21px; }
    .dialog-head p { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .close { border:0; border-radius:9px; width:34px; height:34px; cursor:pointer; color:#697084; background:#f1f2f6; font-size:20px; line-height:1; }
    .dialog-form { display:block; padding:0; margin-top:20px; }
    .dialog-form label + label { margin-top:14px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .error { min-height:20px; margin:9px 0 -5px; color:var(--danger); font-size:12px; }
    .toast { position:fixed; left:50%; bottom:26px; z-index:10; max-width:calc(100% - 32px); transform:translate(-50%,18px) scale(.96); opacity:0; pointer-events:none; color:white; background:#25283b; border-radius:11px; padding:10px 15px; font-size:13px; box-shadow:0 12px 35px rgba(20,22,40,.25); transition:.3s cubic-bezier(.22,1,.36,1); }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @keyframes appear { from { opacity:0; transform:translateY(14px) scale(.985) } to { opacity:1; transform:none } }
    @keyframes fade-up { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
    @keyframes hero-in { from { opacity:0 } to { opacity:1 } }
    @keyframes eyebrow-in { from { opacity:0; transform:translateX(-14px) } to { opacity:1; transform:none } }
    @keyframes title-in { from { opacity:0; transform:translateY(18px); filter:blur(4px) } to { opacity:1; transform:none; filter:none } }
    @keyframes panel-in { from { opacity:0; transform:translateY(22px) scale(.985) } to { opacity:1; transform:none } }
    @keyframes dialog-in { from { opacity:0; transform:translateY(14px) scale(.97) } to { opacity:1; transform:none } }
    @keyframes backdrop-in { from { opacity:0 } to { opacity:1 } }
    @keyframes comment-in { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
    @keyframes float-one { to { transform:translate(42px,-34px) scale(1.08) } }
    @keyframes float-two { to { transform:translate(-38px,-24px) scale(.94) } }
    @keyframes composer-aurora { to { transform:rotate(360deg) } }
    @keyframes button-breathe { 0%,100% { box-shadow:0 8px 18px rgba(90,86,232,.22) } 50% { box-shadow:0 12px 30px rgba(90,86,232,.36) } }
    @keyframes button-shine { 0%,58% { left:-55%; opacity:0 } 70% { opacity:1 } 88%,100% { left:125%; opacity:0 } }
    @keyframes composer-success { 0% { transform:translateY(-3px) scale(1) } 42% { transform:translateY(-3px) scale(1.012); box-shadow:0 28px 88px rgba(31,148,112,.2),0 0 0 2px rgba(40,174,132,.14) } 100% { transform:none } }
    @media (max-width:600px) { .shell { width:min(100% - 24px,940px); padding-top:38px; } form { grid-template-columns:1fr; padding:18px; gap:13px; } .message-field,.form-foot { grid-column:auto; } .form-foot { align-items:flex-end; } .hint { max-width:180px; line-height:1.5; } .board-header { margin-top:32px; align-items:flex-start; } .filter-main { align-items:flex-start; flex-direction:column; gap:12px; } .filter-controls { width:100%; } .date-picker { flex:1; min-width:0; } .message { padding:18px; } .message-top { gap:8px; } .comment-form { grid-template-columns:1fr; } .comment-form.open { max-height:260px; } .comment-form textarea { height:72px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">A SMALL PLACE TO SPEAK</p>
      <h1 id="page-title">留言板</h1>
    </section>
    <section class="panel" id="composerPanel" aria-label="发布留言">
      <form id="messageForm">
        <label>你的昵称<input id="nickname" maxlength="24" required autocomplete="name" /></label>
        <label class="message-field">想说的话<textarea id="content" maxlength="500" required placeholder="写下你的留言…"></textarea></label>
        <div class="form-foot">
          <div class="composer-progress">
            <span class="hint"><span><span id="length">0</span> / 500 字</span><span class="writing-note" id="writingNote">等待你的想法</span></span>
            <div class="character-track" aria-hidden="true"><span class="character-progress" id="characterProgress"></span></div>
          </div>
          <button class="primary" id="submitButton" type="submit">发布留言</button>
        </div>
      </form>
    </section>
    <section aria-labelledby="board-title">
      <div class="board-header">
        <h2 id="board-title">大家的留言 <span class="count" id="count"></span></h2>
        <div class="board-actions">
          <button class="secondary" id="openManager" type="button">管理留言</button>
          <div class="manage-state"><span>管理模式</span><button class="ghost" id="exitManager" type="button">退出</button></div>
        </div>
      </div>
      <div class="filter-bar" aria-label="按日期检索留言">
        <div class="filter-main">
          <div class="filter-copy">
            <span class="filter-kicker">CALENDAR SEARCH</span>
            <strong id="filterStatus">查看全部留言</strong>
          </div>
          <div class="filter-controls">
            <label class="date-picker">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v4M18 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"/></svg>
              <input id="messageDate" type="date" aria-label="选择留言日期" />
            </label>
            <button class="filter-button" id="todayFilter" type="button">今天</button>
            <button class="filter-button" id="clearFilter" type="button" disabled>全部</button>
          </div>
        </div>
        <div class="date-shortcuts" id="dateShortcuts" aria-label="最近有留言的日期"></div>
      </div>
      <div id="messages" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="passwordDialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3>进入管理模式</h3><p>输入管理密码后，即可编辑或删除留言记录。</p></div><button class="close" data-close="passwordDialog" aria-label="关闭">×</button></div>
      <form class="dialog-form" id="passwordForm">
        <label>管理密码<input id="managerPassword" type="password" required autocomplete="current-password" placeholder="请输入密码" /></label>
        <p class="error" id="passwordError" role="alert"></p>
        <div class="dialog-actions"><button class="ghost" data-close="passwordDialog" type="button">取消</button><button class="primary" id="verifyButton" type="submit">验证并进入</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="editDialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3>编辑留言</h3><p>修改昵称或留言内容，保存后会立即更新。</p></div><button class="close" data-close="editDialog" aria-label="关闭">×</button></div>
      <form class="dialog-form" id="editForm">
        <label>昵称<input id="editNickname" maxlength="24" required /></label>
        <label>留言内容<textarea id="editContent" maxlength="500" required></textarea></label>
        <p class="error" id="editError" role="alert"></p>
        <div class="dialog-actions"><button class="ghost" data-close="editDialog" type="button">取消</button><button class="primary" id="saveEdit" type="submit">保存修改</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="confirmDialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3 id="confirmTitle">删除留言</h3><p id="confirmText">此操作无法撤销。</p></div><button class="close" data-close="confirmDialog" aria-label="关闭">×</button></div>
      <div class="dialog-actions"><button class="ghost" data-close="confirmDialog" type="button">取消</button><button class="danger" id="confirmAction" type="button">确认删除</button></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script>
    const API_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/rest/v1/messages';
    const COMMENTS_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/rest/v1/comments';
    const FUNCTION_URL = 'https://hsvyoqcavaxyiabllnnh.supabase.co/functions/v1/manage-messages';
    const API_KEY = 'sb_publishable_rAeVBzahh96lu4guvPb0mQ_At69HCfK';
    const headers = { apikey:API_KEY, 'Content-Type':'application/json' };
    const $ = selector => document.querySelector(selector);
    const form = $('#messageForm'), nickname = $('#nickname'), content = $('#content'), messages = $('#messages');
    const count = $('#count'), length = $('#length'), submitButton = $('#submitButton'), toast = $('#toast');
    const composerPanel = $('#composerPanel'), characterProgress = $('#characterProgress'), writingNote = $('#writingNote');
    const messageDate = $('#messageDate'), filterStatus = $('#filterStatus'), dateShortcuts = $('#dateShortcuts'), clearFilter = $('#clearFilter');
    let items = [], comments = [], activeDate = '', managerPassword = '', editingId = null, pendingAction = null, toastTimer;
    const formatDate = value => new Intl.DateTimeFormat('zh-CN', { dateStyle:'medium', timeStyle:'short' }).format(new Date(value));
    const formatFilterDate = value => new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'short' }).format(new Date(`${value}T12:00:00`));
    const toLocalDateKey = value => { const date = new Date(value), offset = date.getTimezoneOffset(); return new Date(date.getTime() - offset * 60000).toISOString().slice(0,10); };

    function notify(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    function setBusy(button, busy, label) { button.disabled = busy; if (busy) { button.dataset.label = button.textContent; button.textContent = label; } else if (button.dataset.label) { button.textContent = button.dataset.label; delete button.dataset.label; } }
    function closeDialog(id) { const dialog = document.getElementById(id); if (dialog.open) dialog.close(); }
    function updateComposerProgress() {
      const total = content.value.length, percent = Math.min(total / 500 * 100,100);
      length.textContent = total; characterProgress.style.setProperty('--progress-scale',String(percent / 100));
      composerPanel.classList.toggle('is-writing',total > 0); composerPanel.classList.toggle('near-limit',total >= 420);
      writingNote.textContent = total ? (total >= 420 ? '快写满了' : '正在记录这一刻') : '等待你的想法';
    }
    function renderDateShortcuts() {
      const days = new Map();
      items.forEach(item => { const key = toLocalDateKey(item.created_at); days.set(key,(days.get(key) || 0) + 1); });
      dateShortcuts.replaceChildren();
      [...days.entries()].slice(0,7).forEach(([date,total]) => {
        const button = document.createElement('button'); button.type = 'button'; button.className = `date-chip${date === activeDate ? ' active' : ''}`;
        button.dataset.date = date; button.textContent = `${new Intl.DateTimeFormat('zh-CN',{ month:'numeric',day:'numeric' }).format(new Date(`${date}T12:00:00`))} · ${total}`;
        dateShortcuts.append(button);
      });
    }
    function setDateFilter(value) {
      activeDate = value || ''; messageDate.value = activeDate; clearFilter.disabled = !activeDate;
      render();
    }
    function render() {
      const visibleItems = activeDate ? items.filter(item => toLocalDateKey(item.created_at) === activeDate) : items;
      count.textContent = activeDate ? `(${visibleItems.length}/${items.length})` : (items.length ? `(${items.length})` : '');
      filterStatus.textContent = activeDate ? `${formatFilterDate(activeDate)} · ${visibleItems.length} 条留言` : `查看全部留言 · 共 ${items.length} 条`;
      renderDateShortcuts();
      messages.replaceChildren();
      if (!visibleItems.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.innerHTML = activeDate ? '<strong>这一天还没有留言</strong><span>换个日期看看，或成为这一天的第一位留言者。</span>' : '<strong>还没有留言</strong><span>做第一个写下心情的人吧。</span>'; messages.append(empty); return; }
      visibleItems.forEach((item,index) => {
        const itemComments = comments.filter(comment => comment.message_id === item.id);
        const card = document.createElement('article'); card.className = 'message'; card.dataset.id = item.id;
        card.style.setProperty('--i',Math.min(index,8));
        const top = document.createElement('div'); top.className = 'message-top';
        const meta = document.createElement('div');
        const author = document.createElement('span'); author.className = 'author'; author.textContent = item.nickname;
        const time = document.createElement('time'); time.dateTime = item.created_at; time.textContent = formatDate(item.created_at);
        meta.append(author,time);
        const tools = document.createElement('div'); tools.className = 'message-tools';
        const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'icon-button'; edit.dataset.action = 'edit'; edit.textContent = '编辑';
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'icon-button remove'; remove.dataset.action = 'delete'; remove.textContent = '删除';
        tools.append(edit,remove); top.append(meta,tools);
        const text = document.createElement('p'); text.textContent = item.content;
        const commentSection = document.createElement('div'); commentSection.className = 'comments';
        const commentList = document.createElement('div'); commentList.className = 'comment-list';
        itemComments.forEach(comment => {
          const row = document.createElement('div'); row.className = 'comment';
          const commentMeta = document.createElement('div'); commentMeta.className = 'comment-meta';
          const commentAuthor = document.createElement('span'); commentAuthor.className = 'comment-author'; commentAuthor.textContent = comment.nickname;
          const commentTime = document.createElement('time'); commentTime.dateTime = comment.created_at; commentTime.textContent = formatDate(comment.created_at);
          const commentText = document.createElement('p'); commentText.className = 'comment-text'; commentText.textContent = comment.content;
          commentMeta.append(commentAuthor,commentTime); row.append(commentMeta,commentText); commentList.append(row);
        });
        const commentActions = document.createElement('div'); commentActions.className = 'comment-actions';
        const commentCount = document.createElement('span'); commentCount.className = 'comment-count'; commentCount.textContent = itemComments.length ? `${itemComments.length} 条评论` : '还没有评论';
        const commentToggle = document.createElement('button'); commentToggle.type = 'button'; commentToggle.className = 'comment-toggle'; commentToggle.dataset.action = 'toggle-comment'; commentToggle.setAttribute('aria-expanded','false'); commentToggle.textContent = '评论';
        commentActions.append(commentCount,commentToggle);
        const commentForm = document.createElement('form'); commentForm.className = 'comment-form'; commentForm.dataset.commentForm = ''; commentForm.inert = true; commentForm.setAttribute('aria-hidden','true');
        const commentNickname = document.createElement('input'); commentNickname.name = 'nickname'; commentNickname.maxLength = 24; commentNickname.required = true; commentNickname.placeholder = '昵称'; commentNickname.setAttribute('aria-label','评论昵称');
        const commentContent = document.createElement('textarea'); commentContent.name = 'content'; commentContent.maxLength = 300; commentContent.required = true; commentContent.placeholder = '写下你的评论…'; commentContent.setAttribute('aria-label','评论内容');
        const commentSubmit = document.createElement('button'); commentSubmit.type = 'submit'; commentSubmit.className = 'primary comment-submit'; commentSubmit.textContent = '发布评论';
        commentForm.append(commentNickname,commentContent,commentSubmit);
        commentSection.append(commentList,commentActions,commentForm);
        card.append(top,text,commentSection); messages.append(card);
      });
    }
    async function loadMessages() {
      try {
        const [messageResponse,commentResponse] = await Promise.all([
          fetch(`${API_URL}?select=id,nickname,content,created_at&order=created_at.desc`, { headers }),
          fetch(`${COMMENTS_URL}?select=id,message_id,nickname,content,created_at&order=created_at.asc`, { headers })
        ]);
        if (!messageResponse.ok || !commentResponse.ok) throw new Error();
        items = await messageResponse.json(); comments = await commentResponse.json();
        if (items.length) { const dates = items.map(item => toLocalDateKey(item.created_at)).sort(); messageDate.min = dates[0]; messageDate.max = dates[dates.length - 1]; }
        render();
      }
      catch { messages.innerHTML = '<div class="empty"><strong>留言暂时无法加载</strong><span>请稍后刷新页面重试。</span></div>'; }
    }
    async function manage(payload) {
      const response = await fetch(FUNCTION_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ ...payload, password:managerPassword || $('#managerPassword').value }) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) { const error = new Error(data.error || '操作失败，请稍后重试'); error.status = response.status; throw error; }
      return data;
    }
    content.addEventListener('input', updateComposerProgress);
    composerPanel.addEventListener('pointermove', event => { const box = composerPanel.getBoundingClientRect(); composerPanel.style.setProperty('--spot-x',`${event.clientX - box.left}px`); composerPanel.style.setProperty('--spot-y',`${event.clientY - box.top}px`); });
    composerPanel.addEventListener('pointerleave', () => { composerPanel.style.setProperty('--spot-x','50%'); composerPanel.style.setProperty('--spot-y','45%'); });
    messageDate.addEventListener('change', () => setDateFilter(messageDate.value));
    $('#todayFilter').addEventListener('click', () => { const now = new Date(), offset = now.getTimezoneOffset(); setDateFilter(new Date(now.getTime() - offset * 60000).toISOString().slice(0,10)); });
    clearFilter.addEventListener('click', () => setDateFilter(''));
    dateShortcuts.addEventListener('click', event => { const button = event.target.closest('[data-date]'); if (button) setDateFilter(button.dataset.date); });
    form.addEventListener('submit', async event => {
      event.preventDefault(); const name = nickname.value.trim(), text = content.value.trim(); if (!name || !text) return;
      setBusy(submitButton,true,'发布中…');
      try { const response = await fetch(API_URL, { method:'POST', headers:{ ...headers, Prefer:'return=minimal' }, body:JSON.stringify({ nickname:name, content:text }) }); if (!response.ok) throw new Error(); content.value = ''; updateComposerProgress(); composerPanel.classList.add('published'); setTimeout(() => composerPanel.classList.remove('published'),760); await loadMessages(); content.focus(); notify('留言已发布'); }
      catch { notify('发布失败，请稍后重试'); } finally { setBusy(submitButton,false); }
    });
    $('#openManager').addEventListener('click', () => { $('#passwordError').textContent = ''; $('#managerPassword').value = ''; $('#passwordDialog').showModal(); setTimeout(() => $('#managerPassword').focus(), 0); });
    $('#passwordForm').addEventListener('submit', async event => {
      event.preventDefault(); const button = $('#verifyButton'); $('#passwordError').textContent = ''; setBusy(button,true,'验证中…');
      try { await manage({ action:'verify' }); managerPassword = $('#managerPassword').value; document.body.classList.add('managing'); closeDialog('passwordDialog'); notify('已进入管理模式'); }
      catch (error) { $('#passwordError').textContent = error.status === 401 ? '密码不正确，请重新输入' : error.message; }
      finally { setBusy(button,false); }
    });
    $('#exitManager').addEventListener('click', () => { managerPassword = ''; document.body.classList.remove('managing'); notify('已退出管理模式'); });
    messages.addEventListener('click', event => {
      const button = event.target.closest('[data-action]'); if (!button) return;
      if (button.dataset.action === 'toggle-comment') { const commentForm = button.closest('.message').querySelector('[data-comment-form]'), opening = !commentForm.classList.contains('open'); commentForm.classList.toggle('open',opening); commentForm.inert = !opening; commentForm.setAttribute('aria-hidden',String(!opening)); button.setAttribute('aria-expanded',String(opening)); if (opening) commentForm.querySelector('[name="nickname"]').focus(); return; }
      if (!managerPassword) return;
      const item = items.find(entry => entry.id === button.closest('.message').dataset.id); if (!item) return;
      if (button.dataset.action === 'edit') { editingId = item.id; $('#editNickname').value = item.nickname; $('#editContent').value = item.content; $('#editError').textContent = ''; $('#editDialog').showModal(); }
      if (button.dataset.action === 'delete') { pendingAction = { action:'delete', id:item.id }; $('#confirmTitle').textContent = '删除这条留言？'; $('#confirmText').textContent = `“${item.nickname}”的留言将被永久删除。`; $('#confirmAction').textContent = '确认删除'; $('#confirmDialog').showModal(); }
    });
    messages.addEventListener('submit', async event => {
      const commentForm = event.target.closest('[data-comment-form]'); if (!commentForm) return;
      event.preventDefault(); const messageId = commentForm.closest('.message').dataset.id;
      const name = commentForm.elements.nickname.value.trim(), text = commentForm.elements.content.value.trim(), button = commentForm.querySelector('button');
      if (!name || !text) return; setBusy(button,true,'发布中…');
      try {
        const response = await fetch(COMMENTS_URL, { method:'POST', headers:{ ...headers, Prefer:'return=minimal' }, body:JSON.stringify({ message_id:messageId, nickname:name, content:text }) });
        if (!response.ok) throw new Error(); await loadMessages(); notify('评论已发布');
      } catch { notify('评论发布失败，请稍后重试'); } finally { setBusy(button,false); }
    });
    $('#editForm').addEventListener('submit', async event => {
      event.preventDefault(); const button = $('#saveEdit'), name = $('#editNickname').value.trim(), text = $('#editContent').value.trim(); if (!name || !text) return;
      setBusy(button,true,'保存中…'); $('#editError').textContent = '';
      try { await manage({ action:'update', id:editingId, nickname:name, content:text }); closeDialog('editDialog'); await loadMessages(); notify('留言已更新'); }
      catch (error) { $('#editError').textContent = error.message; } finally { setBusy(button,false); }
    });
    $('#confirmAction').addEventListener('click', async () => {
      if (!pendingAction) return; const button = $('#confirmAction'); setBusy(button,true,'处理中…');
      try { await manage(pendingAction); closeDialog('confirmDialog'); pendingAction = null; await loadMessages(); notify('操作已完成'); }
      catch (error) { closeDialog('confirmDialog'); notify(error.message); } finally { setBusy(button,false); }
    });
    document.addEventListener('click', event => { const button = event.target.closest('[data-close]'); if (button) closeDialog(button.dataset.close); });
    document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); }));
    loadMessages();
  </script>
</body>
</html>
